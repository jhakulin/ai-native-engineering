<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1360" viewBox="0 0 1400 1360" role="img" aria-labelledby="title description">
  <title id="title">AI-Native Engineering Workflow: Big Picture</title>
  <desc id="description">Feature work starts with human-owned Jira Epic intent and a Spec agent drafting a Story. A human or AI agent creates a Jira Bug, which triggers the Bug triage agent. Human approval of the Story or acceptance of the Bug diagnosis leads to a shared delivery path. The technical plan identifies affected repositories, changes, and verification; a Planning agent expands it when needed, while an accepted Bug triage report can already provide it. An Implementation agent changes an approved repository in a local workspace, verifies the change, and publishes a linked draft pull request. An independent PR review agent records findings, and a scoped implementation run fixes accepted feedback if needed, then returns to independent review. Human gates approve the Story, diagnosis and scope, and consequential plan choices; a designated human or explicitly approved policy authorizes acceptance and merge. After merge, the work-item owner checks the delivered outcome. Jira, Teams, Confluence, GitHub, a shared AI registry, and the agent runtime support these stages with scoped access. CI indexes GitHub-hosted component catalogs and tree-sitter-derived code graphs in SQLite. Agents query the index through MCP APIs hosted on Azure Functions. A shared observability view linked from work items shows scoped input and output traces, tool actions, evidence, failures, decisions, and versions for each run. Run evidence, failures, and verified outcomes flow to human path owners, who test and version improvements for future runs. Possible execution forms include repository-capable coding agents, SDK-hosted cross-tool agents, and GitHub Agentic Workflows that run a coding engine in GitHub Actions. Each run starts from a configured, authorized trigger.</desc>
