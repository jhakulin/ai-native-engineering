  <rect x="24" y="20" width="1352" height="106" rx="18" fill="#e9f2fc"/>
  <text x="52" y="64" fill="#174a78" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">AI-Native Engineering Workflow: Big Picture</text>
  <text x="52" y="101" fill="#27445f" font-family="Arial, Helvetica, sans-serif" font-size="21">Feature and Bug intake converge on governed delivery. Green labels mark AI agents; gold bars mark approval decisions.</text>

